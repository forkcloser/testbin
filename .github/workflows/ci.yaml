# Seeded once by `limen fix`, then the project's own: limen never updates it.
# The shared lanes (verify on every platform, fuzz, tools) live in
# limen-verify.yaml, content-pinned and kept current by `limen fix`; this file
# calls them, adds the project's own jobs, and gates on all of them.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# No default token permissions: each job states what it needs. This workflow
# only ever reads the repository — it cannot write code, releases, or
# packages even if a step is compromised.
permissions: {}

# A superseded run (new push to the same branch/PR) is cancelled, not raced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  limen:
    uses: farcloser/limen/.github/workflows/limen-verify.yaml@558f7ae692e9df0c5055e9ac2d1d6c66172544f3 # v0.31.0
    permissions:
      contents: read
      # A project that needs another runner set passes it here, e.g.
      # with:
      #   os: '["ubuntu-24.04", "macos-15"]'

  # The groups `just build` builds, read from the .justfile: a tool added
  # there is built here with no edit to this file.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install hermetic (pinned, verified)
        uses: ./.github/actions/setup-hermetic
      - id: groups
        name: The build groups
        shell: bash
        run: echo "groups=$(just build-matrix)" >> "$GITHUB_OUTPUT"
      # release.yaml restores nothing from a cache. Its own guard sees the
      # checkout and $LIMEN_BUILD; the tools hermetic installs live under
      # $HOME, out of its sight. What holds there is this: release.yaml uses
      # these actions and no other, and setup-hermetic uses none.
      - name: The release uses no cache action
        shell: bash
        run: |
          export LC_ALL=C
          allowed=$(printf '%s\n' \
            ./.github/actions/setup-hermetic \
            actions/attest-build-provenance \
            actions/checkout \
            actions/download-artifact \
            actions/upload-artifact | sort)
          # The key as YAML may spell it: quoted, blanks before the colon.
          key="[\"']?uses[\"']?[[:space:]]*:[[:space:]]*"
          used=$(grep -oE "${key}[^@[:space:]]+" .github/workflows/release.yaml | sed -E "s/^${key}//" | sort -u)
          other=$(comm -13 <(echo "${allowed}") <(echo "${used}"))
          # The whole directory, whatever the action's file is called.
          if [ ! -f .github/actions/setup-hermetic/action.yaml ]; then
            echo "::error::.github/actions/setup-hermetic/action.yaml is not there: this check reads it"
            exit 1
          fi
          nested=$(grep -rnE "${key}" .github/actions/setup-hermetic || true)
          if [ -n "${other}${nested}" ]; then
            echo "::error::a release is built with no cache: release.yaml may use the listed actions alone, and setup-hermetic none; found:"
            printf '%s\n' "${other}" "${nested}"
            exit 1
          fi

  # Every tool for every platform, cross-built on linux hosts with the pinned
  # zig, one runner a group of tools, the way a release builds them; and the
  # tools nothing cross-compiles (hadolint, in a container), on a runner of
  # each linux architecture. The verify legs build their own platform and run
  # it (`just test`).
  #
  # Each group is built by two lanes at once, on two runners, from the same
  # caches: `reproducible` holds the two to the same archives.
  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
        lane: [build, rebuild]
    name: ${{ matrix.lane }} (${{ matrix.group.name }})
    runs-on: ${{ matrix.group.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install hermetic (pinned, verified)
        uses: ./.github/actions/setup-hermetic
      # What a build fetches or compiles that its commit does not change is
      # kept between runs: the archives pins.yaml names (each is verified
      # against its sha256 on every use, kept or not), NuGet's packages, zig's
      # runtime libraries (compiler-rt, each target's libc, libc++: most of a
      # cold build), and for the Rust tools the toolchain the verify legs
      # already keep. Every source file is still compiled by every run. The
      # release workflow keeps nothing and restores nothing.
      - id: keys
        name: The caches' keys
        shell: bash
        env:
          TOOLS: ${{ matrix.group.tools }}
        run: |
          rust=false
          for tool in $TOOLS; do
            if [ -f "${tool}/Cargo.toml" ]; then rust=true; fi
          done
          # A tool whose build keeps a directory of its own says what that
          # directory is a function of (`just <tool>-kept`).
          kept=""
          for tool in $TOOLS; do
            if [ -n "$(just --summary | tr ' ' '\n' | grep -x -F -- "${tool}-kept" || true)" ]; then
              kept="${kept}$(just "${tool}-kept")"
            fi
          done
          if [ -n "${kept}" ]; then
            kept=$(printf '%s' "${kept}" | sha256sum | cut -d ' ' -f 1)
          fi
          {
            echo "zig=$(zig version)"
            echo "group=${TOOLS// /+}"
            echo "rust=${rust}"
            echo "kept=${kept}"
          } >> "$GITHUB_OUTPUT"
          # Older than anything this run verifies: what is no newer when the
          # build is done is an archive no pin names any more.
          touch "$RUNNER_TEMP/started"
      # Restored alone: the verify legs save it, on the default branch.
      - if: steps.keys.outputs.rust == 'true'
        uses: ./.github/actions/cache
        with:
          mode: restore
          go: 'false'
      - id: zig
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.LIMEN_BUILD }}/zig/global
          key: zig-global-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.zig }}-${{ steps.keys.outputs.group }}
      # A changed pin restores the last entry and fetches what moved alone.
      - id: downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.LIMEN_BUILD }}/src/*.tar.gz
            ${{ env.LIMEN_BUILD }}/src/*.tar.xz
            ${{ env.LIMEN_BUILD }}/src/*.zip
            ${{ env.LIMEN_BUILD }}/nuget
          key: project-downloads-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.group }}-${{ hashFiles('pins.yaml', '**/packages.lock.json', 'flake/locks/*.lock.json') }}
          restore-keys: |
            project-downloads-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.group }}-
      # What a tool's own build keeps (hadolint: alpine's packages, cabal's
      # index, source archives and compiled dependencies, ten of its twelve
      # minutes). The exact key alone: a directory filled under other inputs
      # is not this build's.
      - id: kept
        if: steps.keys.outputs.kept != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.LIMEN_BUILD }}/kept
          key: project-kept-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.group }}-${{ steps.keys.outputs.kept }}
      - name: Build the group
        shell: bash
        env:
          TOOLS: ${{ matrix.group.tools }}
        run: |
          read -r -a tools <<< "$TOOLS"
          just build-group "${tools[@]}"
      - id: built
        name: The archives' checksums
        shell: bash
        env:
          LANE: ${{ matrix.lane }}
          INDEX: ${{ strategy.job-index }}
        run: |
          mkdir -p "$RUNNER_TEMP/sums"
          (cd "$LIMEN_BUILD/dist" && sha256sum -- *.tar.gz) | tee "$RUNNER_TEMP/sums/$LANE-$INDEX"
          # A group zig built nothing of (hadolint) has no cache of it to save.
          if [ -d "$LIMEN_BUILD/zig/global" ]; then echo "zig=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sums-${{ matrix.lane }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/sums
          if-no-files-found: error
          retention-days: 1
      # The archives themselves, for a day: when the two lanes differ, the
      # checksums say which archive and these say where in it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.lane }}-${{ strategy.job-index }}
          path: ${{ env.LIMEN_BUILD }}/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1
      # The default branch only, only on a miss, and from one lane: an entry a
      # pull request run saves is restorable by that pull request alone, and a
      # key is never overwritten.
      - if: matrix.lane == 'build' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.zig.outputs.cache-hit != 'true' && steps.built.outputs.zig == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.LIMEN_BUILD }}/zig/global
          key: ${{ steps.zig.outputs.cache-primary-key }}
      - if: matrix.lane == 'build' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.downloads.outputs.cache-hit != 'true'
        name: Drop the archives no pin names any more
        shell: bash
        run: |
          if [ -d "$LIMEN_BUILD/src" ]; then
            find "$LIMEN_BUILD/src" -maxdepth 1 -type f ! -newer "$RUNNER_TEMP/started" -print -delete
          fi
      - if: matrix.lane == 'build' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.LIMEN_BUILD }}/src/*.tar.gz
            ${{ env.LIMEN_BUILD }}/src/*.tar.xz
            ${{ env.LIMEN_BUILD }}/src/*.zip
            ${{ env.LIMEN_BUILD }}/nuget
          key: ${{ steps.downloads.outputs.cache-primary-key }}
      - if: matrix.lane == 'build' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.keys.outputs.kept != '' && steps.kept.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.LIMEN_BUILD }}/kept
          key: ${{ steps.kept.outputs.cache-primary-key }}

  # The two lanes' archives, one against the other: a published archive can be
  # checked by building it only if a build of its commit gives the same bytes.
  reproducible:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sums-*
          path: sums
          merge-multiple: true
      - name: The two lanes built the same archives
        shell: bash
        run: |
          export LC_ALL=C
          cat sums/build-* | sort -k 2 > build
          cat sums/rebuild-* | sort -k 2 > rebuild
          if [ ! -s build ]; then
            echo "::error::no archive to compare: the build lane uploaded no checksum"
            exit 1
          fi
          if ! diff build rebuild; then
            echo "::error::the two lanes did not build the same archives (<: build, >: rebuild)"
            exit 1
          fi
          cat build

  # The ONE required status check (defaultRequiredChecks in
  # internal/github/audit.go). Requiring the lanes by name would bake the
  # runner list into every ruleset; this job collapses them to one stable
  # name. A project job joins `needs` and the assertion below.
  gate:
    needs: [limen, plan, build, reproducible]
    # always(), and the result asserted explicitly. Without always() a failed
    # or cancelled dependency SKIPS this job instead of failing it, and a
    # skipped required check does not block a merge — branch protection that
    # quietly stops protecting. `needs.limen.result` is success only when
    # every lane it ran succeeded: each verify leg, fuzz and tools.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every lane succeeded
        env:
          # Via env, never interpolated into the script: the shell sees data,
          # not something the expression layer can rewrite into code.
          LIMEN: ${{ needs.limen.result }}
          PLAN: ${{ needs.plan.result }}
          BUILD: ${{ needs.build.result }}
          REPRODUCIBLE: ${{ needs.reproducible.result }}
        shell: bash
        run: |
          printf 'limen: %s\nplan: %s\nbuild: %s\nreproducible: %s\n' "$LIMEN" "$PLAN" "$BUILD" "$REPRODUCIBLE"
          [ "$LIMEN" = "success" ] && [ "$PLAN" = "success" ] && [ "$BUILD" = "success" ] && [ "$REPRODUCIBLE" = "success" ]
