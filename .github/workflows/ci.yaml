# Seeded once by `limen fix`, then the project's own: limen never updates it.
# The shared lanes (verify on every platform, fuzz, tools) live in
# limen-verify.yaml, content-pinned and kept current by `limen fix`; this file
# calls them, adds the project's own jobs, and gates on all of them.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# No default token permissions: each job states what it needs. This workflow
# only ever reads the repository — it cannot write code, releases, or
# packages even if a step is compromised.
permissions: {}

# A superseded run (new push to the same branch/PR) is cancelled, not raced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  limen:
    uses: farcloser/limen/.github/workflows/limen-verify.yaml@35b1536b6d63dd309b55725d0d048ffd2124e92b # v0.28.0
    permissions:
      contents: read
      # A project that needs another runner set passes it here, e.g.
      # with:
      #   os: '["ubuntu-24.04", "macos-15"]'

  # The groups `just build` builds, read from the .justfile: a tool added
  # there is built here with no edit to this file.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install hermetic (pinned, verified)
        uses: ./.github/actions/setup-hermetic
      - id: groups
        name: The build groups
        shell: bash
        run: echo "groups=$(just build-matrix)" >> "$GITHUB_OUTPUT"

  # Every tool for every platform, cross-built on linux hosts with the pinned
  # zig, one runner a group of tools, the way a release builds them. The
  # verify legs build their own platform and run it (`just test`).
  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        tools: ${{ fromJSON(needs.plan.outputs.groups) }}
    name: build (${{ matrix.tools }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install hermetic (pinned, verified)
        uses: ./.github/actions/setup-hermetic
      # zig compiles its runtime libraries (compiler-rt, each target's libc,
      # libc++) into its global cache on first use, which is most of a cold
      # build. That directory alone is kept between runs, one entry a group
      # and zig version: every source file is still compiled by every run.
      # The release workflow keeps nothing and restores nothing.
      - id: zig
        name: The zig cache's key
        shell: bash
        env:
          TOOLS: ${{ matrix.tools }}
        run: |
          {
            echo "version=$(zig version)"
            echo "group=${TOOLS// /+}"
          } >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.LIMEN_BUILD }}/zig/global
          key: zig-global-${{ runner.os }}-${{ runner.arch }}-${{ steps.zig.outputs.version }}-${{ steps.zig.outputs.group }}
      - name: Build the group for every platform
        shell: bash
        env:
          TOOLS: ${{ matrix.tools }}
        run: |
          read -r -a tools <<< "$TOOLS"
          just build-group "${tools[@]}"
      # The default branch only, and only on a miss: an entry a pull request
      # run saves is restorable by that pull request alone, and a key is
      # never overwritten.
      - if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.LIMEN_BUILD }}/zig/global
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # The ONE required status check (defaultRequiredChecks in
  # internal/github/audit.go). Requiring the lanes by name would bake the
  # runner list into every ruleset; this job collapses them to one stable
  # name. A project job joins `needs` and the assertion below.
  gate:
    needs: [limen, plan, build]
    # always(), and the result asserted explicitly. Without always() a failed
    # or cancelled dependency SKIPS this job instead of failing it, and a
    # skipped required check does not block a merge — branch protection that
    # quietly stops protecting. `needs.limen.result` is success only when
    # every lane it ran succeeded: each verify leg, fuzz and tools.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every lane succeeded
        env:
          # Via env, never interpolated into the script: the shell sees data,
          # not something the expression layer can rewrite into code.
          LIMEN: ${{ needs.limen.result }}
          PLAN: ${{ needs.plan.result }}
          BUILD: ${{ needs.build.result }}
        shell: bash
        run: |
          printf 'limen: %s\nplan: %s\nbuild: %s\n' "$LIMEN" "$PLAN" "$BUILD"
          [ "$LIMEN" = "success" ] && [ "$PLAN" = "success" ] && [ "$BUILD" = "success" ]
