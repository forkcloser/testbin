# Release lane for testbin (custom: C tools built with zig, so the canonical
# goreleaser lane does not apply; same construction rules: SHA-pinned actions,
# per-job permissions, bash everywhere).
#
# A pushed v* tag builds every tool for every platform on one linux host (zig
# cross-compiles them all), runs each archive's binaries on its own platform,
# then attests every archive and checksums.txt and attaches them to the
# release. workflow_dispatch is the dry run: build and smoke, no publish.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install hermetic (pinned, verified)
        uses: ./.github/actions/setup-hermetic
      - name: Build every tool for every platform
        run: just build
      - name: The release notes' source section
        run: just release-notes > .build/notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: .build/dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: .build/notes.md
          if-no-files-found: error

  # The published archives themselves, run where they will run: a binary that
  # cross-compiled is not yet a binary that works.
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, platform: linux-amd64}
          - {runner: ubuntu-24.04-arm, platform: linux-arm64}
          - {runner: macos-15-intel, platform: darwin-amd64}
          - {runner: macos-15, platform: darwin-arm64}
          - {runner: windows-2025, platform: windows-amd64}
          - {runner: windows-11-arm, platform: windows-arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No hermetic here: the smoke needs only bash and the runner's own
      # coreutils, and the pins carry no checksums for darwin amd64.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Run the archive's binaries
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p unpacked
          for archive in dist/*-"${PLATFORM}".tar.gz; do
            tar -xzf "${archive}" -C unpacked
          done
          flac=$(echo unpacked/flac-*-"${PLATFORM}")
          bash flac/smoke.sh "${flac}"
          bash drflac/smoke.sh unpacked/drflac-*-"${PLATFORM}" "${flac}"

  publish:
    # Tag pushes only: a workflow_dispatch run stops after the smoke legs.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Publish the release and its assets.
      contents: write
      # GitHub Artifact Attestations (keyless provenance; hermetic verifies).
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Checksums
        run: cd dist && sha256sum -- *.tar.gz > checksums.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # Everything published, checksums.txt included: no unattested asset.
          subject-path: dist/*
      - name: Publish release
        # `just do release vX.Y.Z` creates the release page right after pushing
        # the tag, so the assets are attached to it; a tag pushed by hand has no
        # page yet, and it is created here. --clobber makes a rerun idempotent.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/*
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
          path: notes
      - name: The corresponding source in the release notes
        # Appended to the notes the page already has; a rerun finds the section
        # and leaves the notes as they are.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes/current.md
          if ! grep -q '^## Corresponding source$' notes/current.md; then
            { cat notes/current.md; echo; cat notes/notes.md; } > notes/full.md
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes/full.md
          fi
