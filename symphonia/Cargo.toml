[package]
name = "testbin-symphonia"
description = "A FLAC decoder on Symphonia"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[[bin]]
name = "symphonia"
path = "src/main.rs"

[dependencies]
symphonia = { version = "=0.6.1", default-features = false, features = ["flac"] }
