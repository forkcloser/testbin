# The upstream sources testbin builds, pinned by version and digest (limen's
# book, tooling.md, "Pinned artifacts beyond aqua"). Each tool's build reads its
# entry back with `limen pins get <name> url|sha256`; Renovate proposes the
# bumps from the renovate: lines and `limen pins refresh` recomputes the digest.
pins:
  # xiph publishes no signature or checksum beside the GitHub release asset:
  # TLS is the whole guarantee.
  - name: flac
    renovate: github-releases xiph/flac
    version: 1.5.0
    url: https://github.com/xiph/flac/releases/download/${version}/flac-${version}.tar.xz
    verify: download
    digest:
      version: 1.5.0
      sha256: f2c1c76592a82ffff8413ba3c4a1299b6c7ab06c734dee03fd88630485c2b920
  # dr_libs tags each library's releases (flac-X.Y.Z); the archive is GitHub's
  # tarball of that tag. dr_flac is public domain or MIT-0, its choice.
  - name: drflac
    renovate: github-tags mackron/dr_libs
    extract-version: ^flac-(?<version>.*)$
    version: 0.13.4
    url: https://github.com/mackron/dr_libs/archive/refs/tags/flac-${version}.tar.gz
    verify: download
    digest:
      version: 0.13.4
      sha256: bb1ba8d206d8bf2c2fb20d93f4ca4c592d4cbf4621fd7a7711529699c3298d14
  # CUETools' release tag; its Flake encoder is built from the tag tarball.
  - name: cuetools
    renovate: github-tags gchudov/cuetools.net
    extract-version: ^v(?<version>.*)$
    version: 2.2.6
    url: https://github.com/gchudov/cuetools.net/archive/refs/tags/v${version}.tar.gz
    verify: download
    digest:
      version: 2.2.6
      sha256: e263bac9f8d6cab35997cd6f04210cad2ea748e55bebc00e69a35b84a2ddec5f
  # erofs-utils' release tag; mkfs.erofs is built from the tag tarball,
  # patched with erofs/patches.
  - name: erofs-utils
    renovate: github-tags erofs/erofs-utils
    extract-version: ^v(?<version>[0-9]+\.[0-9]+\.[0-9]+)$
    version: 1.9.4
    url: https://github.com/erofs/erofs-utils/archive/refs/tags/v${version}.tar.gz
    verify: download
    digest:
      version: 1.9.4
      sha256: 7d135aa2550326a5acf20f53c518aea5a8900015ce50700044e40f818c31dd80
  # lz4's release tag: the compressor library mkfs.erofs links.
  - name: lz4
    renovate: github-tags lz4/lz4
    extract-version: ^v(?<version>[0-9]+\.[0-9]+\.[0-9]+)$
    version: 1.10.0
    url: https://github.com/lz4/lz4/archive/refs/tags/v${version}.tar.gz
    verify: download
    digest:
      version: 1.10.0
      sha256: 537512904744b35e232912055ccf8ec66d768639ff3abe5788d90d792ec5f48b
  # CSCore's last release tag; its FLAC decoder is compiled from the tag
  # tarball into cscoreflac, the rest of the library left out.
  - name: cscore
    renovate: github-tags filoe/cscore
    extract-version: ^v?(?<version>.*)$
    version: 1.2.1.2
    url: https://github.com/filoe/cscore/archive/refs/tags/${version}.tar.gz
    verify: download
    digest:
      version: 1.2.1.2
      sha256: a37a882114964e28ef91362c130565d6a5367172eb1283164ae620e939a14f62
  # The .NET SDK that builds CUETools, one archive per platform a build or a
  # test runs on (the toolchain is a pinned archive, not a registry tool: the
  # registries the policy authorizes carry no .NET SDK).
  - name: dotnet-sdk-linux-amd64
    renovate: dotnet-version dotnet-sdk
    version: 10.0.403
    url: https://builds.dotnet.microsoft.com/dotnet/Sdk/${version}/dotnet-sdk-${version}-linux-x64.tar.gz
    verify: download
    digest:
      version: 10.0.403
      sha256: cd7224fe8e8ba57c15f1601439ff8785a1a72b54ae5c89dd5302a32dcfbddf18
  - name: dotnet-sdk-linux-arm64
    renovate: dotnet-version dotnet-sdk
    version: 10.0.403
    url: https://builds.dotnet.microsoft.com/dotnet/Sdk/${version}/dotnet-sdk-${version}-linux-arm64.tar.gz
    verify: download
    digest:
      version: 10.0.403
      sha256: 21fe1a0963984206bfaeb19968da07e7a61d30c9bc4621b7372a762a30c88679
  - name: dotnet-sdk-darwin-arm64
    renovate: dotnet-version dotnet-sdk
    version: 10.0.403
    url: https://builds.dotnet.microsoft.com/dotnet/Sdk/${version}/dotnet-sdk-${version}-osx-arm64.tar.gz
    verify: download
    digest:
      version: 10.0.403
      sha256: 826d7ff91fa83b16bccd7edd7822581fe32b5228a4501aabe61d864168129d73
  - name: dotnet-sdk-windows-amd64
    renovate: dotnet-version dotnet-sdk
    version: 10.0.403
    url: https://builds.dotnet.microsoft.com/dotnet/Sdk/${version}/dotnet-sdk-${version}-win-x64.zip
    verify: download
    digest:
      version: 10.0.403
      sha256: f398979a9cac2dba760771c4e01f16e431dcd6bcfb2213e3e8f5b3d354095cc0
  - name: dotnet-sdk-windows-arm64
    renovate: dotnet-version dotnet-sdk
    version: 10.0.403
    url: https://builds.dotnet.microsoft.com/dotnet/Sdk/${version}/dotnet-sdk-${version}-win-arm64.zip
    verify: download
    digest:
      version: 10.0.403
      sha256: c8d5a6714ae9561c2c41f00325a8f9b34f80f520263059921a36a141cddf2ca8
